<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Laptop Display</title>
<style>
  body {
    background-color: #0f172a;
    color:#f8fafc;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .card {
    background-color: #1e293b;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    text-align: center;
    max-width: 400px;
  }

  .card img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    object-fit: cover;
  }

  .card h2 {
    margin-top: 16px;
    margin-bottom: 8px;
    font-size: 1.5rem;
  }

  .card p {
    color: #94a3b8;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  </style>
    </head>
    <body>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8" alt="Laptop">
        <h2> لابتوب الأحلام</h2>
    <p>جاهز لجلسة برمجة طويلة ومحتوى كود نظيف!</p>
  </div>

</body>
</html>
